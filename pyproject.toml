[tool.poetry]
name = "chimera-gw"
version = "2.3"
description = "Combined Hierarchical Inference Model for Electromagnetic and gRavitational-wave Analysis"
authors = ["Nicola Borghi <nicola.borghi6@unibo.it>", "Matteo Tagliazucchi <matteo.tagliazucchi2@unibo.it>"]
license = "GPL-3.0-only"
readme = "README.md"
repository = "https://github.com/CosmoStatGW/CHIMERA"
documentation = "https://chimera-gw.readthedocs.io/latest/"
packages = [
  {include = "CHIMERA"},
]

[tool.poetry.dependencies]
# Core Python requirements
python = ">=3.12"

# Scientific computing core
numpy = ">=2.0"
scipy = ">=1.11"

# Astronomy and cosmology
astropy = ">=5.2"
healpy = ">=1.14"

# Data handling
h5py = ">=3.5"
packaging = "*"

# Machine learning and optimization
scikit-learn = ">=1.0"
numba = ">=0.58"

# JAX ecosystem
jax = ">=0.5"
equinox = "*"
interpax = "*"

# KDExpress
KDExpress = "*"

# Utilities
plum-dispatch = "*"

# Sampling and MCMC
emcee = "*"

# Parallel computing (optional for docs)
mpi4py = { version = ">=4.0", optional = true }
mpi4jax = { version = "*", extras = ["no-build-isolation"], optional = true }
schwimmbad = { version = ">=0.3.2", optional = true }

# HTTP requests
requests = ">=2.32.5"

# Security floors for transitive dependencies (GitHub Dependabot advisories).
# Not imported by CHIMERA directly: pulled in by requests, matplotlib and the docs stack.
urllib3 = ">=2.8.0"
certifi = ">=2026.10.18"
pillow = { version = ">=13.0.0", optional = true }
tornado = { version = ">=6.6", optional = true }
mistune = { version = ">=3.3.0", optional = true }
nbconvert = { version = ">=7.17.2", optional = true }
soupsieve = { version = ">=2.9.0", optional = true }
setuptools = { version = ">=84.1.0", optional = true }

# Samplers and chain I/O (optional, used by CHIMERA.utils.emcee_utils / numpyro_utils)
zeus-mcmc = { version = "*", optional = true }
dill = { version = "*", optional = true }
numpyro = { version = "*", optional = true }
arviz = { version = "*", optional = true }

# Plotting (optional for core functionality)
matplotlib = { version = ">=3.4", optional = true }

# Documentation dependencies (optional)
sphinx = { version = ">=7.0", optional = true }
sphinx-book-theme = { version = ">=1.1", optional = true }
myst-nb = { version = ">=1.1", optional = true }
sphinx-copybutton = { version = ">=0.5.2", optional = true }
ipython = { version = ">=8.0", optional = true }

[tool.poetry.extras]
plots = ["matplotlib", "pillow"]
mpi = ["mpi4py", "mpi4jax", "schwimmbad"]
samplers = ["zeus-mcmc", "dill", "numpyro", "arviz"]
docs = ["sphinx", "sphinx-book-theme", "myst-nb", "sphinx-copybutton", "ipython", "matplotlib",
        "pillow", "tornado", "mistune", "nbconvert", "soupsieve", "setuptools"]
all = ["matplotlib", "pillow", "mpi4py", "mpi4jax", "schwimmbad", "zeus-mcmc", "dill", "numpyro", "arviz"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
