# Build, check and publish chimera-gw when a version tag is pushed.
#
#   git tag -a v2.3 -m "CHIMERA 2.3" && git push origin v2.3
#
# - The tag must match `version` in pyproject.toml (v2.3 <-> 2.3, compared as
#   PEP 440 versions, so v2.3.1 <-> 2.3.1 also works).
# - Pre-release tags (v2.4rc1, v2.4b1, ...) go to TestPyPI, final tags to PyPI.
# - Publishing uses PyPI Trusted Publishing (OIDC): no API token in the repo.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build and check distributions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check tag matches pyproject version
        id: version
        run: |
          pip install -q packaging
          python - <<'PY'
          import os, sys, tomllib
          from packaging.version import Version
          tag = os.environ["GITHUB_REF_NAME"]
          version = tomllib.load(open("pyproject.toml", "rb"))["tool"]["poetry"]["version"]
          if not tag.startswith("v") or Version(tag[1:]) != Version(version):
              sys.exit(f"Tag {tag} does not match pyproject.toml version {version} (expected v{version})")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"version={version}\n")
              f.write(f"prerelease={str(Version(version).is_prerelease).lower()}\n")
          print(f"Releasing {version} (pre-release: {Version(version).is_prerelease})")
          PY

      - name: Build sdist and wheel
        run: |
          pip install -q build twine
          python -m build

      - name: Check distributions
        run: |
          twine check --strict dist/*
          python - <<'PY'
          import glob, tarfile, zipfile
          bad = ("checkpoint", "__pycache__", ".pyc", "examples/", "docs/")
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          names += tarfile.open(glob.glob("dist/*.tar.gz")[0]).getnames()
          leaked = [n for n in names if any(b in n for b in bad)]
          if leaked:
              raise SystemExit(f"Unexpected files in distributions: {leaked}")
          print(f"{len(names)} files, no stray content")
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  test:
    name: Test wheel (Python ${{ matrix.python }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Install wheel in a clean environment
        run: pip install "$(ls dist/*.whl)[samplers]"

      - name: Import all modules and check version
        working-directory: ${{ runner.temp }}   # import the installed wheel, not a checkout
        env:
          EXPECTED: ${{ needs.build.outputs.version }}
        run: |
          python - <<'PY'
          import importlib, os, pkgutil, CHIMERA
          # CHIMERA.parallel still targets the v1 API (CHIMERA.bias) and needs a port.
          skip = {"CHIMERA.parallel"}
          mods = [m.name for m in pkgutil.walk_packages(CHIMERA.__path__, "CHIMERA.") if m.name not in skip]
          for m in mods:
              importlib.import_module(m)
          assert CHIMERA.__version__ == os.environ["EXPECTED"], (CHIMERA.__version__, os.environ["EXPECTED"])
          print(f"imported {len(mods)} modules, CHIMERA {CHIMERA.__version__}")
          PY

  publish-testpypi:
    name: Publish to TestPyPI
    if: needs.build.outputs.prerelease == 'true'
    needs: [build, test]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/chimera-gw
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    if: needs.build.outputs.prerelease == 'false'
    needs: [build, test]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/chimera-gw
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub release
    needs: [build, publish-testpypi, publish-pypi]
    if: always() && needs.build.result == 'success' && (needs.publish-pypi.result == 'success' || needs.publish-testpypi.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          prerelease: ${{ needs.build.outputs.prerelease == 'true' }}
          generate_release_notes: true
